services:
  deployment-agent:
    image: ${DEPLOY_AGENT_IMAGE:?Укажите готовый образ deployment-agent}
    restart: unless-stopped
    init: true
    env_file: ${DEPLOY_AGENT_ENV_FILE:-.env.deployment-agent}
    environment:
      DEPLOY_ROLE: backend
      DOCKER_CONFIG: /run/docker
    tmpfs:
      - /run/docker:mode=0700
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DEPLOY_ROOT:?Укажите DEPLOY_ROOT}:${DEPLOY_ROOT}
      - ${DEPLOY_SSH_DIRECTORY:-/etc/worker-cabinet/deploy-ssh}:/run/deploy-ssh:ro
    networks:
      - application

networks:
  application:
    external: true
    name: ${DEPLOY_NETWORK:?Укажите существующую сеть приложения}
