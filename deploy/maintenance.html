<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="30">
  <title>Обновление системы — Личный кабинет</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f7fb; color: #192941; font: 16px/1.6 system-ui, sans-serif; }
    main { box-sizing: border-box; width: min(100%, 540px); padding: 40px 28px; }
    h1 { font-size: 28px; line-height: 1.25; }
    p { color: #52627a; }
    span { display: inline-block; padding: 5px 12px; border-radius: 20px; background: #e0eaff; color: #244da4; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <span>Личный кабинет работника</span>
    <h1>Обновляем систему</h1>
    <p>Личный кабинет временно недоступен. Пожалуйста, подождите несколько минут — страница обновится автоматически.</p>
  </main>
</body>
</html>
