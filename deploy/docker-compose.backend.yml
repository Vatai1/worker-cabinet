services:
  postgres:
    image: postgres:16-alpine
    container_name: worker-cabinet-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-worker_cabinet}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../docker/init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - worker-cabinet-network

  minio:
    image: minio/minio:latest
    container_name: worker-cabinet-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin123}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - worker-cabinet-network

  onlyoffice-redis:
    image: redis:7-alpine
    container_name: worker-cabinet-onlyoffice-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - worker-cabinet-network

  onlyoffice:
    image: onlyoffice/documentserver:9.4.0
    container_name: worker-cabinet-onlyoffice
    restart: unless-stopped
    ports:
      - "${ONLYOFFICE_PORT:-8080}:80"
    environment:
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET}
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET}
      SECURE_LINK_SECRET: ${ONLYOFFICE_JWT_SECRET}
      USE_UNAUTHORIZED_STORAGE: "true"
      JWT_ENABLED: "true"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${ONLYOFFICE_DB_NAME:-onlyoffice}
      DB_USER: ${DB_USER:-postgres}
      DB_PWD: ${DB_PASSWORD}
      REDIS_SERVER_HOST: onlyoffice-redis
      REDIS_SERVER_PORT: "6379"
    extra_hosts:
      - "${APP_DOMAIN}:${FRONTEND_HOST_IP}"
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
      - onlyoffice_lib:/var/lib/onlyoffice
      - ./onlyoffice-local.json:/etc/onlyoffice/documentserver/local.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      onlyoffice-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/healthcheck || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - worker-cabinet-network

  ollama:
    image: ollama/ollama:latest
    container_name: worker-cabinet-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    deploy:
      resources:
        limits:
          memory: 8G
    networks:
      - worker-cabinet-network

  mini-agent:
    image: vatai12/worker-cabinet-mini-agent:latest
    container_name: worker-cabinet-mini-agent
    restart: unless-stopped
    depends_on:
      - ollama
    environment:
      MODEL: ${MINI_AGENT_MODEL:-qwen2.5:3b}
      BASE_URL: http://ollama:11434/v1
    ports:
      - "127.0.0.1:8642:8642"
    networks:
      - worker-cabinet-network

  backend:
    image: ${BACKEND_IMAGE:-vatai12/worker-cabinet-backend:latest}
    container_name: worker-cabinet-backend
    restart: unless-stopped
    environment: &backend-environment
      PORT: "5000"
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-worker_cabinet}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      JWT_SECRET: ${JWT_SECRET:-changeme}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-worker-cabinet}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-worker-cabinet}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin123}
      FRONTEND_URL: ${FRONTEND_URL}
      PUBLIC_URL: ${PUBLIC_URL}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin123}
      S3_BUCKET: ${S3_BUCKET:-worker-cabinet}
      MAIL_HOST: ${MAIL_HOST:-smtp.example.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_SECURE: ${MAIL_SECURE:-false}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_RATE_PER_MINUTE: ${MAIL_RATE_PER_MINUTE:-20}
      MAIL_FROM: ${MAIL_FROM:-"Worker Cabinet" <noreply@example.com>}
      ONLYOFFICE_URL: ${ONLYOFFICE_URL:-http://localhost:8080}
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-changeme}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://backend:5000/api}
      MINI_AGENT_URL: http://mini-agent:8642/v1/chat
      ASSISTANT_API_BASE_URL: http://backend:5000/api
      OLLAMA_URL: http://ollama:11434
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - worker-cabinet-network

  notification-worker:
    image: ${BACKEND_IMAGE:-vatai12/worker-cabinet-backend:latest}
    container_name: worker-cabinet-notification-worker
    restart: unless-stopped
    command: ["node", "src/worker.js"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - worker-cabinet-network

volumes:
  postgres_data:
  minio_data:
  onlyoffice_data:
  onlyoffice_logs:
  onlyoffice_lib:
  ollama_data:

networks:
  worker-cabinet-network:
    driver: bridge
